services:
  postgres:
    image: postgres:17
    container_name: academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_dev
      POSTGRES_DB: academy_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: academy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: academy-garage
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,z

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: academy-garage-webui
    restart: unless-stopped
    ports:
      - "3909:3909"
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,z
    depends_on:
      - garage

  video-worker:
    build:
      context: .
      dockerfile: backend/cmd/video-worker/Dockerfile
    container_name: academy-video-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - garage
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_dev
      POSTGRES_DB: academy_os
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GK9d6fd0c70061eb8da2b879d5}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-e7890f4f7573b61d4145ef22d1b3f9810e3dd24937b7e1261cdb28cd5543269b}
      S3_BUCKET: academy

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data: