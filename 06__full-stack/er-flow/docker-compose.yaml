services:
  mongodb:
    image: mongo:8
    container_name: er-flow-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - mongodb_data:/data/db

    networks:
      - er-flow-network

  mongo-express:
    image: mongo-express

    container_name: er-flow-mongo-express

    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongodb

    depends_on:
      - mongodb

    networks:
      - er-flow-network

  redis:
    image: redis:8-alpine

    container_name: er-flow-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - er-flow-network

  redis-insight:
    image: redis/redisinsight:latest

    container_name: redis-insight

    ports:
      - "5540:5540"

    depends_on:
      - redis

    networks:
      - er-flow-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: er-flow-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://admin:password@mongodb:27017/er-flow?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BETTER_AUTH_SECRET: replace-with-a-long-random-secret
      BETTER_AUTH_URL: http://localhost:3001
      APP_URL: http://localhost:3000
      OLLAMA_HOST: http://host.docker.internal:11435
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - mongodb
      - redis
    networks:
      - er-flow-network

  collaboration-server:
    build:
      context: .
      dockerfile: apps/collaboration-server/Dockerfile
    container_name: er-flow-collaboration-server
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      PORT: 1234
      MONGODB_URI: mongodb://admin:password@mongodb:27017/er-flow?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mongodb
      - redis
    networks:
      - er-flow-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: er-flow-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - er-flow-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
        VITE_COLLABORATION_URL: ws://localhost:1234
    container_name: er-flow-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    depends_on:
      - api
      - collaboration-server
    networks:
      - er-flow-network

  ollama-proxy:
    image: node:22-alpine
    container_name: er-flow-ollama-proxy
    network_mode: "host"
    command: node -e "const net = require('net'); net.createServer(s => { const c = net.connect(11434, '127.0.0.1'); s.pipe(c).pipe(s); s.on('error', () => {}); c.on('error', () => {}); }).listen(11435, '0.0.0.0'); console.log('Ollama proxy listening on 11435');"
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:

networks:
  er-flow-network:
