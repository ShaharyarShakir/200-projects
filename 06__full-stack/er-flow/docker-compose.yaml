services:
  mongodb:
    image: mongo:8
    container_name: er-flow-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - mongodb_data:/data/db

    networks:
      - er-flow-network

  mongo-express:
    image: mongo-express

    container_name: er-flow-mongo-express

    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongodb

    depends_on:
      - mongodb

    networks:
      - er-flow-network

  redis:
    image: redis:8-alpine

    container_name: er-flow-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - er-flow-network

  redis-insight:
    image: redis/redisinsight:latest

    container_name: redis-insight

    ports:
      - "5540:5540"

    depends_on:
      - redis

    networks:
      - er-flow-network

volumes:
  mongodb_data:
  redis_data:

networks:
  er-flow-network:
