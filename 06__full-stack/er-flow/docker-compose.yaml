services:
  mongodb:
    image: mongo:8
    container_name: er-flow-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - mongodb_data:/data/db

    networks:
      - er-flow-network

  mongo-express:
    image: mongo-express

    container_name: er-flow-mongo-express

    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongodb

    depends_on:
      - mongodb

    networks:
      - er-flow-network

  redis:
    image: redis:8-alpine

    container_name: er-flow-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - er-flow-network

  redis-insight:
    image: redis/redisinsight:latest

    container_name: redis-insight

    ports:
      - "5540:5540"

    depends_on:
      - redis

    networks:
      - er-flow-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: er-flow-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://admin:password@mongodb:27017/er-flow?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BETTER_AUTH_SECRET: replace-with-a-long-random-secret
      BETTER_AUTH_URL: http://localhost:3001
      APP_URL: http://localhost:3000
    depends_on:
      - mongodb
      - redis
    networks:
      - er-flow-network

  collaboration-server:
    build:
      context: .
      dockerfile: apps/collaboration-server/Dockerfile
    container_name: er-flow-collaboration-server
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      PORT: 1234
      MONGODB_URI: mongodb://admin:password@mongodb:27017/er-flow?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mongodb
      - redis
    networks:
      - er-flow-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: er-flow-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - er-flow-network

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:

networks:
  er-flow-network:
