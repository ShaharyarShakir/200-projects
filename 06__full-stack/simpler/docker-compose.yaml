services:
  postgres:
    image: postgres:17-alpine

    container_name: simpler-db

    restart: unless-stopped

    ports:
      - '5432:5432'

    environment:
      POSTGRES_DB: simpler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
