[project]
name = "Dispatcher"
version = "0.1.0"
description = "Dispatcher app with ELD log generation and route optimization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=25.1",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.0",
    "httpx>=0.28.1",
    "gunicorn>=26.0.0",
    "pillow>=12.3.0",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-django>=4.12.0", "ruff>=0.15.22"]
