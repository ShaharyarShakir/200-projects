root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"

  include_ext = ["go", "html", "tmpl", "tpl", "css"]

  exclude_dir = [
    "tmp",
    "vendor",
    "testdata",
    ".git"
  ]

  exclude_regex = ["_test.go"]

  delay = 500
  stop_on_error = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  time = true

[misc]
  clean_on_exit = true