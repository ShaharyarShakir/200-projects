<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if title %}
        Fastapi Blog - {{ title }}
        {% else %}
        Fastapi Blog
        {% endif %}
    </title>
</head>

<body>
    <h1>Home Page of blog</h1>
    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
        </div>
    {% endfor %}
</body>

</html>
