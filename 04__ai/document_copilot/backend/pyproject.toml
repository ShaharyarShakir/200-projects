[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
   "alembic==1.18.4",
   "fastapi[standard]==0.136.3",
   "pgvector==0.4.2",
   "psycopg[binary]==3.3.4",
   "sqlalchemy==2.0.50",
]

[project.optional-dependencies]
ingest = [
    "docling==2.96.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ipykernel==7.2.0",
    "pytest==9.0.3",
    "ruff==0.15.15",
]
